# Run lint (flake8, autopep8), tests, and coverage on push/PR to development, main, master.

name: CI (lint, test, coverage)

on:
  push:
    branches: [development, main, master]
  pull_request:
    branches: [development, main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 autopep8 pytest-cov

      - name: Run tests with coverage
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=50
